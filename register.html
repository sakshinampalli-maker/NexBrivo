<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Request collaborator access to Alex Morgan's private staging and deliverables portal.">
    <title>Request Access &mdash; Alex Morgan Portal</title>
    <!-- Google Fonts: Outfit (Display & Headings) + Plus Jakarta Sans (Interface & Body) + JetBrains Mono (Tech & Stats) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Main Wrapper -->
    <main class="login-wrapper">
        <a href="homepage.html" class="back-home-link" aria-label="Return to portfolio homepage">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Portfolio</span>
        </a>

        <div class="login-card" id="register-card">

            <!-- Card Header -->
            <header class="card-header">
                <div class="logo-badge" aria-label="Brand Initials">AM</div>
                <h1 class="title">Request <em>Access</em></h1>
                <p class="subtitle">For active clients, hiring leads, and engineering collaborators requesting project deliverables & staging access.</p>
            </header>

            <!-- Notification / Alert -->
            <div id="alert-box" class="alert alert-success hidden" role="alert">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span id="alert-message">Access request submitted. A notification has been sent to Alex.</span>
            </div>

            <!-- Registration Form -->
            <form id="register-form" class="login-form" novalidate>

                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="user-name">Your Full Name</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="user-name" name="fullname" placeholder="Sarah Jenkins" autocomplete="name" required>
                    </div>
                    <span class="field-error" id="name-error"></span>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="user-email">Work / Organization Email</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </span>
                        <input type="email" id="user-email" name="email" placeholder="sarah@company.com" autocomplete="email" required>
                    </div>
                    <span class="field-error" id="email-error"></span>
                </div>

                <!-- Project Reference or Organization -->
                <div class="form-group">
                    <label for="user-org">Organization or Project Code</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                            </svg>
                        </span>
                        <input type="text" id="user-org" name="organization" placeholder="e.g. Acme Corp / DocuFlow Review" required>
                    </div>
                    <span class="field-error" id="org-error"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="user-password">Desired Workspace Passcode</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="user-password" name="password" placeholder="••••••••••••" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" id="toggle-password-btn" aria-label="Toggle password visibility" tabindex="0">
                            <!-- Eye Icon -->
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <!-- Eye Slash Icon -->
                            <svg id="eye-slash-icon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- Password Strength Meter -->
                    <div class="strength-meter" id="strength-meter">
                        <div class="strength-track">
                            <div class="strength-bar" id="strength-bar"></div>
                        </div>
                        <div class="strength-info">
                            <span>Passcode complexity</span>
                            <span class="strength-label" id="strength-label">Too short</span>
                        </div>
                    </div>

                    <span class="field-error" id="password-error"></span>
                </div>

                <!-- Terms Notice -->
                <div class="remember-row">
                    <label class="checkbox-container">
                        <input type="checkbox" id="agree-terms" name="terms" checked>
                        <span class="checkmark">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </span>
                        <span class="checkbox-label">I agree to mutual NDA and confidential staging terms</span>
                    </label>
                </div>
                <span class="field-error" id="terms-error"></span>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submit-btn">
                    <span id="btn-text">Submit Request</span>
                    <span class="btn-spinner hidden" id="btn-spinner"></span>
                    <svg id="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>

            </form>

            <!-- Card Footer -->
            <footer class="card-footer">
                <p>Already have an active key? <a href="login.html" class="signup-link">Sign into workspace</a></p>
            </footer>

        </div>
    </main>

    <!-- Interactive Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const registerForm = document.getElementById('register-form');
            const nameInput = document.getElementById('user-name');
            const emailInput = document.getElementById('user-email');
            const orgInput = document.getElementById('user-org');
            const passwordInput = document.getElementById('user-password');
            const termsInput = document.getElementById('agree-terms');
            
            const nameError = document.getElementById('name-error');
            const emailError = document.getElementById('email-error');
            const orgError = document.getElementById('org-error');
            const passwordError = document.getElementById('password-error');
            const termsError = document.getElementById('terms-error');

            const togglePasswordBtn = document.getElementById('toggle-password-btn');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeSlashIcon = document.getElementById('eye-slash-icon');
            
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const btnIcon = document.getElementById('btn-icon');
            const alertBox = document.getElementById('alert-box');
            const alertMessage = document.getElementById('alert-message');
            const registerCard = document.getElementById('register-card');

            const strengthMeter = document.getElementById('strength-meter');
            const strengthBar = document.getElementById('strength-bar');
            const strengthLabel = document.getElementById('strength-label');

            // 1. Show / Hide Password Toggle
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                eyeIcon.classList.toggle('hidden', isPassword);
                eyeSlashIcon.classList.toggle('hidden', !isPassword);
                passwordInput.focus();
            });

            // 2. Password Strength Evaluation
            passwordInput.addEventListener('input', () => {
                const val = passwordInput.value;
                if (!val) {
                    strengthMeter.classList.remove('active');
                    return;
                }

                strengthMeter.classList.add('active');

                let score = 0;
                if (val.length >= 6) score += 1;
                if (val.length >= 10) score += 1;
                if (/[A-Z]/.test(val)) score += 1;
                if (/[0-9]/.test(val)) score += 1;
                if (/[^A-Za-z0-9]/.test(val)) score += 1;

                if (score <= 1) {
                    strengthBar.style.width = '25%';
                    strengthBar.style.backgroundColor = '#f43f5e';
                    strengthLabel.textContent = 'Basic';
                    strengthLabel.style.color = '#fb7185';
                } else if (score === 2 || score === 3) {
                    strengthBar.style.width = '60%';
                    strengthBar.style.backgroundColor = '#e59840';
                    strengthLabel.textContent = 'Sufficient';
                    strengthLabel.style.color = '#fcd34d';
                } else {
                    strengthBar.style.width = '100%';
                    strengthBar.style.backgroundColor = '#10b981';
                    strengthLabel.textContent = 'Strong';
                    strengthLabel.style.color = '#34d399';
                }

                passwordError.textContent = '';
                passwordInput.classList.remove('input-error');
            });

            [nameInput, emailInput, orgInput].forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('input-error');
                });
            });

            // 3. Form Validation & Submission
            registerForm.addEventListener('submit', (e) => {
                e.preventDefault();

                let isValid = true;
                const nameVal = nameInput.value.trim();
                const emailVal = emailInput.value.trim();
                const orgVal = orgInput.value.trim();
                const passwordVal = passwordInput.value;

                if (!nameVal) {
                    nameError.textContent = 'Full name is required.';
                    nameInput.classList.add('input-error');
                    isValid = false;
                } else {
                    nameError.textContent = '';
                }

                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailVal || !emailPattern.test(emailVal)) {
                    emailError.textContent = 'Valid work email is required.';
                    emailInput.classList.add('input-error');
                    isValid = false;
                } else {
                    emailError.textContent = '';
                }

                if (!orgVal) {
                    orgError.textContent = 'Organization or project name is required.';
                    orgInput.classList.add('input-error');
                    isValid = false;
                } else {
                    orgError.textContent = '';
                }

                if (!passwordVal || passwordVal.length < 6) {
                    passwordError.textContent = 'Passcode must be at least 6 characters.';
                    passwordInput.classList.add('input-error');
                    isValid = false;
                } else {
                    passwordError.textContent = '';
                }

                if (!termsInput.checked) {
                    termsError.textContent = 'You must agree to confidentiality terms.';
                    isValid = false;
                } else {
                    termsError.textContent = '';
                }

                if (!isValid) {
                    registerCard.classList.remove('shake-animation');
                    void registerCard.offsetWidth;
                    registerCard.classList.add('shake-animation');
                    return;
                }

                submitBtn.disabled = true;
                btnText.textContent = 'Submitting Request...';
                btnSpinner.classList.remove('hidden');
                btnIcon.classList.add('hidden');
                alertBox.classList.add('hidden');

                setTimeout(() => {
                    submitBtn.disabled = false;
                    btnText.textContent = 'Submit Request';
                    btnSpinner.classList.add('hidden');
                    btnIcon.classList.remove('hidden');

                    alertBox.className = 'alert alert-success';
                    alertMessage.textContent = 'Request received! Alex will review and email your workspace key.';
                    alertBox.classList.remove('hidden');
                    registerForm.reset();
                }, 900);
            });
        });
    </script>
</body>

</html>
